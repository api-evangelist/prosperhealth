name: Prosper Health
description: >-
  Prosper Health is a telehealth provider focused exclusively on autistic and
  neurodivergent adults, offering virtual autism diagnostic assessments and
  ongoing affirming, strength-based therapy delivered by licensed psychologists
  and therapists who specialize in adult autism. Its adult-validated,
  telehealth-native assessment (an alternative to the child-oriented ADOS) runs
  entirely online across two psychologist sessions plus a feedback session, with
  results reported within roughly two weeks. Prosper Health accepts major
  insurers (Aetna, BCBS, Cigna, Oscar, Oxford, United) across 20-plus US states.
  It is a direct-to-consumer clinical care company with no public developer API
  surface; this profile tracks its web, security, and identity properties for
  the API Evangelist network.
